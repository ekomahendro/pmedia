<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Shalat Digital Masjid - Full Responsive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        html, body {
            height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: url('masjid2.jpeg') no-repeat center center fixed;
            background-size: cover;
            overflow: hidden;
        }

        body {
            background-color: rgba(0, 0, 0, 0.6); 
            color: white;
            display: flex;
            flex-direction: column;
            padding: 0.75rem;
            box-sizing: border-box;
        }

        .glass { 
            background: rgba(0, 0, 0, 0.75); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255,255,255,0.15); 
            border-radius: 1rem;
        }

        .jadwal-flex-row {
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            gap: 0.5rem;
            width: 100%;
        }

        .card-shalat {
            flex: 1;
            padding: 0.5rem 0.25rem;
            transition: all 0.5s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .scroll-container {
            flex: 1;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
        }

        .animate-scroll-misi {
            animation: scrollUpMisi 25s linear infinite;
            position: absolute;
            top: 0;
            width: 100%;
        }

        .animate-scroll-takmir {
            animation: scrollUpTakmir 60s linear infinite;
            position: absolute;
            top: 0;
            width: 100%;
        }

        .no-animate {
            animation: none !important;
            position: relative;
            width: 100%;
        }

        @keyframes scrollUpMisi {
            0% { transform: translateY(100px); }
            100% { transform: translateY(-120%); }
        }

        @keyframes scrollUpTakmir {
            0% { transform: translateY(100px); }
            100% { transform: translateY(-150%); }
        }

        .marquee-container {
            height: 50px;
            overflow: hidden;
            background: rgba(153, 27, 27, 0.9);
            border-left: 8px solid #fbbf24;
            display: flex;
            align-items: center;
            border-radius: 0.75rem;
            margin-top: 0.75rem;
            flex-shrink: 0;
        }

        .marquee-text {
            display: inline-block;
            white-space: nowrap;
            animation: marquee 40s linear infinite;
            font-size: 1.5rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        .highlight { 
            border: 3px solid #fbbf24; 
            background: rgba(251, 191, 36, 0.3); 
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.4);
        }

        .font-arab {
            font-family: 'Amiri', serif;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <header class="glass flex flex-wrap justify-between items-center px-5 py-2 mb-3 gap-2 flex-shrink-0">
        <div class="flex items-center gap-3">
            <img src="muhajirin.png" alt="Logo" class="h-12 w-12 object-contain">
            <div>
                <h1 id="m-nama" class="text-lg md:text-xl font-black text-yellow-500 uppercase leading-none">MEMUAT...</h1>
                <p id="m-info" class="text-[9px] md:text-xs mt-0.5 opacity-80 font-bold"></p>
            </div>
        </div>
        
        <div class="text-center px-4 border-l border-white/20">
            <div class="text-[9px] uppercase font-black tracking-widest text-yellow-500 italic">Menuju <span id="next-name">-</span></div>
            <div id="countdown" class="text-2xl md:text-4xl font-mono font-black text-white leading-none">00:00:00</div>
        </div>

        <div class="text-center px-4 border-l border-white/20 min-w-[150px]">
            <div id="tgl-masehi" class="text-lg md:text-xl font-black text-yellow-500 leading-tight"></div>
        </div>
        
        <div class="text-right">
            <div id="jam" class="text-4xl md:text-5xl font-mono font-black text-white tracking-tighter leading-none">00:00</div>
            <div class="text-[10px] font-black text-yellow-500 tracking-widest">WITA</div>
        </div>
    </header>

    <main class="flex flex-col lg:flex-row gap-3 flex-1 overflow-hidden">
        
        <div class="flex flex-col gap-3 lg:w-[75%] overflow-hidden">
            <div id="jadwal-container" class="jadwal-flex-row flex-shrink-0"></div>
            
            <div class="flex flex-col md:flex-row gap-3 flex-1 overflow-hidden">
                <div class="glass p-4 flex-1 bg-black/40 flex flex-col justify-center text-center">
                    <h4 class="text-yellow-500 font-black text-lg mb-2 border-b border-yellow-500/30 pb-1 uppercase italic tracking-widest">Visi</h4>
                    <p id="v-teks" class="text-sm md:text-base font-semibold italic text-white px-2"></p>
                </div>
                
                <div id="box-rotasi" class="glass p-4 flex-[1.5] bg-black/40 flex flex-col overflow-hidden">
                    <h4 id="judul-rotasi" class="text-yellow-500 font-black text-lg mb-2 border-b border-yellow-500/30 pb-1 uppercase italic text-center tracking-widest">Misi</h4>
                    <div class="scroll-container">
                        <div id="konten-rotasi" class="text-sm space-y-2 font-semibold px-2 w-full"></div>
                    </div>
                </div>
            </div>
        </div>

        <aside class="glass p-4 flex flex-col lg:w-[25%] overflow-hidden">
            <h3 class="text-lg font-black text-yellow-500 border-b-2 border-yellow-500 pb-2 mb-3 text-center uppercase tracking-widest">Takmir Masjid</h3>
            <div class="scroll-container">
                <div id="takmir-scroll-content" class="animate-scroll-takmir space-y-2 w-full px-1"></div>
            </div>
        </aside>
    </main>

    <div class="marquee-container shadow-2xl">
        <div id="running-text" class="marquee-text">...</div>
    </div>

    <script>
        const KOTA_ID = "1709"; 
        let dataGlobal = {};
        let jadwalShalat = {};
        let rotasiIndex = 0;

async function cli() {
        try {
            // Membaca file lisensi yang dienkripsi
            const response = await fetch('lce.dat?t=' + Date.now());
            if (!response.ok) throw new Error();
            
            const encryptedDomain = await response.text();
            // Mendekripsi Base64 ke teks biasa
            const allowedDomain = atob(encryptedDomain.trim());
            
            // Mengambil hostname saat ini
            const currentDomain = window.location.hostname;

            // Validasi: Jika domain tidak cocok, hentikan aplikasi
            if (currentDomain !== allowedDomain) {
                document.body.innerHTML = `
                    <div style="height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; background:#1a1a1a; color:#ff4444; font-family:sans-serif; text-align:center; padding:20px;">
                        <i class="fas fa-exclamation-triangle" style="font-size:50px; margin-bottom:20px;"></i>
                        <h1 style="font-size:24px; font-weight:bold;">LISENSI TIDAK VALID</h1>
                        <p style="color:#ccc; margin-top:10px;">Aplikasi ini tidak diizinkan berjalan di domain: <br><strong>${currentDomain}</strong></p>
                    </div>
                `;
                return false;
            }
            return true;
        } catch (e) {
            document.body.innerHTML = "<div style='color:white; text-align:center; margin-top:20vh;'>License File Missing or Corrupt.</div>";
            return false;
        }
    }
        async function init() {
            const isAuthorized = await cli();
            if (!isAuthorized) return; 
            await loadData();
            await fetchJadwal();
            setInterval(updateClock, 1000);
            setInterval(fetchJadwal, 3600000);
            setInterval(rotasiKonten, 25000); 
            rotasiKonten(); 
        }

        async function loadData() {
            try {
                const res = await fetch('data.json?t=' + Date.now());
                dataGlobal = await res.json();
                document.getElementById('m-nama').innerText = dataGlobal.masjid.nama;
                document.getElementById('m-info').innerText = dataGlobal.masjid.alamat;
                document.getElementById('running-text').innerText = dataGlobal.pengumuman;
                document.getElementById('v-teks').innerText = dataGlobal.visi;

                const tContent = document.getElementById('takmir-scroll-content');
                const tHtml = dataGlobal.takmir.map(t => `
                    <div class="bg-white/10 p-3 rounded-lg border-l-4 border-yellow-500 shadow">
                        <div class="font-black text-[9px] text-yellow-500 uppercase tracking-wider">${t.jabatan}</div>
                        <div class="text-sm font-bold text-white leading-tight">${t.nama}</div>
                    </div>
                `).join('');
                tContent.innerHTML = tHtml + tHtml + tHtml;
            } catch (e) { console.error("JSON Error"); }
        }

        function rotasiKonten() {
            const container = document.getElementById('konten-rotasi');
            const judul = document.getElementById('judul-rotasi');
            let html = "";
            container.style.opacity = 0;

            setTimeout(() => {
                container.classList.remove('animate-scroll-misi', 'no-animate');

                if (rotasiIndex === 0) {
                    judul.innerText = "Misi Masjid";
                    container.classList.add('animate-scroll-misi');
                    html = `<ul class="space-y-2">` + dataGlobal.misi.map(m => `
                        <li class="flex items-start bg-white/5 p-2 rounded-lg border-l-2 border-yellow-500/50">
                            <i class="fas fa-check-circle text-yellow-500 mt-1 mr-2 text-xs"></i>
                            <span>${m}</span>
                        </li>`).join('') + `</ul>`;
                    rotasiIndex = 1;
                } else if (rotasiIndex === 1) {
                    judul.innerText = "Doa Sesudah Wudhu";
                    container.classList.add('no-animate');
                    html = `<div class="text-center py-2">
                        <div class="text-2xl font-arab mb-3 text-yellow-100" dir="rtl">أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ</div>
                        <div class="text-xs italic text-yellow-400 font-bold">"Aku bersaksi bahwa tidak ada Tuhan selain Allah..."</div>
                    </div>`;
                    rotasiIndex = 2;
                } else {
                    judul.innerText = "Doa Sesudah Adzan";
                    container.classList.add('no-animate');
                    html = `<div class="text-center py-1">
                        <div class="text-xl font-arab mb-2 text-yellow-100" dir="rtl">اللَّهُمَّ رَبَّ هَذِهِ الدَّعْوَةِ التَّامَّةِ، وَالصَّلَاةِ الْقَائِمَةِ، آتِ مُحَمَّدًا الْوَسِيْلَةَ وَالْفَضِيْلَةَ، وَابْعَثْهُ مَقَامًا مَحْمُوْدًا الَّذِيْ وَعَدْتَهُ</div>
                        <div class="text-[10px] italic text-yellow-400 font-bold px-2 leading-tight">"Ya Allah, Tuhan pemilik panggilan yang sempurna ini dan shalat yang didirikan, berilah Muhammad wasilah dan keutamaan, dan bangkitkanlah beliau di tempat yang terpuji yang telah Engkau janjikan."</div>
                    </div>`;
                    rotasiIndex = 0;
                }
                container.innerHTML = html;
                container.style.opacity = 1;
            }, 500);
        }

        async function fetchJadwal() {
            try {
                const d = new Date();
                const res = await fetch(`https://api.myquran.com/v2/sholat/jadwal/${KOTA_ID}/${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`);
                const json = await res.json();
                if (json.status && json.data) {
                    const j = json.data.jadwal;
                    
                    // Logika Nama Hari Bahasa Arab
                    const days = ["Ahad", "Itsnain", "Tsulatsa", "Arbi'a", "Khamis", "Jumu'ah", "Sabt"];
                    const namaHari = days[d.getDay()];
                    const bulan = d.toLocaleDateString('id-ID', {month: 'long', year: 'numeric'});
                    
                    document.getElementById('tgl-masehi').innerHTML = `${namaHari}, ${d.getDate()} ${bulan}`;
                    
                    jadwalShalat = { "Subuh": j.subuh, "Terbit": j.terbit, "Dhuha": j.dhuha, "Dzuhur": j.dzuhur, "Ashar": j.ashar, "Maghrib": j.maghrib, "Isya": j.isya };
                    const icons = { Subuh: 'fa-cloud-moon', Terbit: 'fa-sun', Dhuha: 'fa-cloud-sun', Dzuhur: 'fa-certificate', Ashar: 'fa-cloud-sun', Maghrib: 'fa-moon', Isya: 'fa-star-and-crescent' };

                    document.getElementById('jadwal-container').innerHTML = Object.keys(jadwalShalat).map(k => `
                        <div id="card-${k}" class="glass card-shalat shadow-lg">
                            <i class="fas ${icons[k]} text-xl mb-1 text-yellow-500"></i>
                            <h4 class="font-black text-[9px] opacity-70 uppercase tracking-tighter">${k}</h4>
                            <div class="text-2xl md:text-3xl font-black text-white leading-none my-1">${jadwalShalat[k]}</div>
                            ${['Terbit', 'Dhuha'].includes(k) ? '' : `<div class="text-[8px] font-bold text-yellow-200 uppercase truncate w-full px-1">Imam: ${dataGlobal.imam ? dataGlobal.imam[k] : '-'}</div>`}
                        </div>
                    `).join('');
                }
            } catch (e) { console.error("API Error"); }
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('jam').innerText = now.toLocaleTimeString('id-ID', {hour12: false, hour: '2-digit', minute: '2-digit'});

            let nextName = ""; let nextTime = null;
            for (const [name, time] of Object.entries(jadwalShalat)) {
                const [h, m] = time.split(':');
                const target = new Date(now);
                target.setHours(parseInt(h), parseInt(m), 0);
                if (target > now) { nextName = name; nextTime = target; break; }
            }
            if (!nextTime) {
                const [h, m] = (jadwalShalat.Subuh || "04:30").split(':');
                nextTime = new Date(now); nextTime.setDate(now.getDate() + 1); nextTime.setHours(parseInt(h), parseInt(m), 0);
                nextName = "Subuh";
            }

            document.getElementById('next-name').innerText = nextName;
            const diff = nextTime - now;
            const h = Math.floor(diff/3600000); const m = Math.floor((diff%3600000)/60000); const s = Math.floor((diff%60000)/1000);
            document.getElementById('countdown').innerText = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;

            document.querySelectorAll('.card-shalat').forEach(el => el.classList.remove('highlight'));
            const active = document.getElementById(`card-${nextName}`);
            if(active) active.classList.add('highlight');
        }

        init();
    </script>
</body>
</html>
