<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infografik Timeline Interaktif</title>

<!-- Font Awesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
    font-family: Arial, sans-serif;
    background: #f8faff;
    margin: 0;
    padding: 20px;
}

/* Judul */
h2 {
    text-align: center;
    color: #0a4ead;
    margin-bottom: 30px;
    font-size: 24px;
}

/* Horizontal Timeline */
.timeline-horizontal {
    display: flex;
    justify-content: space-between;
    gap: 30px;
    margin: 50px 0;
    position: relative;
}
.timeline-horizontal::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    height: 6px;
    background: #0a4ead;
    transform: translateY(-50%);
    border-radius: 4px;
}
.item {
    background: white;
    padding: 15px;
    border-radius: 12px;
    border: 2px solid #0a4ead;
    min-width: 180px;
    text-align: center;
    position: relative;
    animation: slide-from-bottom 0.9s ease forwards;
    opacity: 0;
}
.item i {
    font-size: 26px;
    color: #0a4ead;
    margin-bottom: 10px;
    display: block;
}
.item span {
    font-weight: bold;
    color: #0a4ead;
}

/* Vertical Timeline */
.timeline-vertical {
    width: 100%;
    max-width: 600px;
    margin: auto;
    position: relative;
    padding-left: 30px;
}
.timeline-vertical::before {
    content:"";
    position: absolute;
    left: 15px;
    top:0;
    width: 6px;
    height: 100%;
    background:#0a4ead;
    border-radius:4px;
}
.v-item {
    background:white;
    border:2px solid #0a4ead;
    padding:15px;
    margin: 20px 0;
    border-radius:12px;
    position: relative;
    animation: slide-from-left 0.9s ease forwards;
    opacity: 0;
}
.v-item i {
    font-size: 26px;
    color:#0a4ead;
    margin-right:10px;
}
.v-item::before {
    content: "";
    position: absolute;
    left: -17px;
    top: 20px;
    width: 18px;
    height: 18px;
    background: white;
    border: 4px solid #0a4ead;
    border-radius: 50%;
}

/* Animations */
@keyframes slide-from-bottom {
    from {opacity: 0; transform: translateY(30px);}
    to   {opacity: 1; transform: translateY(0);}
}
@keyframes slide-from-left {
    from {opacity: 0; transform: translateX(-30px);}
    to   {opacity: 1; transform: translateX(0);}
}

/* Responsive */
@media(max-width:800px){
    .timeline-horizontal {
        flex-direction: column;
        align-items: center;
    }
    .timeline-horizontal::before {
        display:none;
    }
}
</style>

</head>
<body>

<h2>Timeline Horizontal</h2>
<div class="timeline-horizontal">
    <div class="item"><i class="fa-solid fa-flag-checkered"></i><span>Awal Konsep</span><br>Perencanaan Sekolah</div>
    <div class="item"><i class="fa-solid fa-code"></i><span>Pengembangan</span><br>Kurikulum IT & English</div>
    <div class="item"><i class="fa-solid fa-building-columns"></i><span>Fasilitas</span><br>Lab & Infrastruktur</div>
    <div class="item"><i class="fa-solid fa-rocket"></i><span>Grand Launch</span><br>Opening SMP Informatika</div>
</div>

<h2>Timeline Vertikal</h2>
<div class="timeline-vertical">
    <div class="v-item"><i class="fa-solid fa-check"></i>Legalitas & Perijinan Selesai</div>
    <div class="v-item"><i class="fa-solid fa-users"></i>Rekrutmen Guru Ahli</div>
    <div class="v-item"><i class="fa-solid fa-laptop-code"></i>Program IT & Olimpiade Matematika</div>
    <div class="v-item"><i class="fa-solid fa-graduation-cap"></i>Siswa Angkatan Pertama Diterima</div>
</div>

<script>
// Menjalankan animasi saat elemen terlihat di layar
const observer = new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
        if(entry.isIntersecting){
            entry.target.style.opacity = 1;
        }
    });
});
document.querySelectorAll(".item, .v-item").forEach(el=> observer.observe(el));
</script>

</body>
</html>
